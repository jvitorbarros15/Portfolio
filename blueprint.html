<style>
:root {
  --navy: #0f1b3d; --navy-deep: #08112a; --line: #ffffff12; --line-strong: #ffffff26;
  --ink-on-navy: #dfe6ff; --muted-on-navy: #9fb0e8;
  --paper: #f5f6fa; --paper-bar: #e4e7f0; --ink: #0f1b3d; --ink-soft: #4b557a;
  --yellow: #ffd166; --green: #7ee0a5;
  --ease: cubic-bezier(.2, 1.2, .3, 1);
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--navy);
  color: var(--ink-on-navy); font: 15px/1.55 'Archivo', system-ui, sans-serif; overflow: hidden;
}
a { color: inherit; }
.mono { font-family: 'Martian Mono', ui-monospace, monospace; }

.menubar { position: fixed; inset: 0 0 auto 0; height: 34px; display: flex; align-items: center; gap: 20px; padding: 0 16px; font: 500 12px 'Martian Mono', monospace; color: var(--muted-on-navy); border-bottom: 1px solid var(--line-strong); background: #0f1b3dcc; z-index: 1000; }
.menubar strong { color: var(--ink-on-navy); }
.menubar button { all: unset; cursor: pointer; }
.menubar button:hover, .menubar button:focus-visible { color: var(--yellow); }
.menubar .right { margin-left: auto; display: flex; gap: 16px; align-items: center; }
.menubar .recenter { border: 1px solid var(--line-strong); border-radius: 4px; padding: 3px 8px; }
.bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; vertical-align: middle; margin-right: 6px; }
.bars i { width: 2px; background: var(--yellow); animation: eq .9s ease-in-out infinite; }
.bars i:nth-child(2) { animation-delay: .15s } .bars i:nth-child(3) { animation-delay: .3s } .bars i:nth-child(4) { animation-delay: .45s }
@keyframes eq { 0%,100% { height: 3px } 50% { height: 12px } }

.desk { position: fixed; inset: 34px 0 0 0; }
#pan { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 24px 24px; background-position: var(--gx, 0) var(--gy, 0); }
#pan.grabbing { cursor: grabbing; }
#canvas { position: absolute; left: 0; top: 0; will-change: transform; }
#windows { position: absolute; inset: 0; pointer-events: none; }
#windows .win { pointer-events: auto; }

.annot { position: absolute; font: 12px 'Martian Mono', monospace; color: var(--muted-on-navy); pointer-events: none; }
.annot .dim { display: block; border-top: 1px dashed var(--muted-on-navy); margin-bottom: 4px; position: relative; }
.annot .dim::before, .annot .dim::after { content: ''; position: absolute; top: -4px; width: 1px; height: 7px; background: var(--muted-on-navy); }
.annot .dim::before { left: 0 } .annot .dim::after { right: 0 }

.pipeline { position: absolute; left: 40px; top: 760px; display: flex; gap: 10px; align-items: center; font: 12px 'Martian Mono', monospace; color: var(--muted-on-navy); }
.pipeline span { border: 1px dashed var(--muted-on-navy); padding: 8px 12px; border-radius: 4px; background: var(--navy); }
.pipeline .flow { width: 28px; height: 1px; background: repeating-linear-gradient(90deg, var(--yellow) 0 4px, transparent 4px 8px); background-size: 16px 1px; animation: flow 1s linear infinite; }
@keyframes flow { to { background-position: 16px 0 } }
.pipeline em { color: var(--yellow); font-style: normal; }
.pipeline .label { position: absolute; top: -22px; left: 0; }

.win { position: absolute; background: var(--paper); color: var(--ink); border-radius: 10px; box-shadow: 0 30px 60px -30px #000c, 0 0 0 1px #ffffff1a; overflow: hidden; display: flex; flex-direction: column; animation: pop .55s var(--ease) both; max-height: calc(100vh - 140px); }
.win.closing { animation: close .2s ease-in both; }
@keyframes pop { from { transform: translateY(16px) scale(.96); opacity: 0 } }
@keyframes close { to { transform: scale(.96); opacity: 0 } }
.win .bar { display: flex; align-items: center; gap: 6px; padding: 9px 12px; background: var(--paper-bar); font: 12px 'Martian Mono', monospace; color: #59618a; cursor: grab; user-select: none; }
.win .bar:active { cursor: grabbing; }
.win .bar button { all: unset; width: 11px; height: 11px; border-radius: 50%; background: #bfc5d9; cursor: pointer; }
.win .bar button.x:hover { background: #ef6b5b; }
.win .bar span { margin-left: 6px; }
.win .body { padding: 22px; overflow: auto; }
.win.dark { background: var(--navy-deep); color: var(--muted-on-navy); box-shadow: 0 30px 60px -30px #000c, 0 0 0 1px var(--line-strong); }
.win.dark .bar { background: #0c1835; color: var(--muted-on-navy); }
.win.dark .bar button { background: #22336b; }

h1 { font: 800 clamp(30px, 3.4vw, 42px)/1.02 'Archivo'; letter-spacing: -0.02em; }
h2 { font: 700 22px/1.1 'Archivo'; margin-bottom: 4px; }
h3 { font: 700 17px/1.2 'Archivo'; }
.lede { color: var(--ink-soft); margin: 12px 0 18px; max-width: 46ch; }
.kick { font: 500 12px 'Martian Mono', monospace; color: #59618a; margin-bottom: 10px; display: flex; gap: 8px; align-items: center; }
.kick .live { width: 7px; height: 7px; border-radius: 50%; background: #2fae6b; }
.ctas { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 6px; border: 1.5px solid var(--ink); font: 600 14px 'Archivo'; text-decoration: none; color: var(--ink); background: transparent; cursor: pointer; transition: transform .15s var(--ease), background .15s; }
.btn:hover { transform: translateY(-2px); }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn:active { transform: translateY(0); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1.5px solid var(--ink); margin-top: 20px; padding-top: 12px; gap: 12px; }
.stats b { font: 800 26px 'Archivo'; display: block; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--ink-soft); line-height: 1.3; display: block; }

.list { list-style: none; padding: 0; }
.list li { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 14px 0; border-top: 1px solid #d8dbe6; }
.list li:first-child { border-top: 0; padding-top: 0; }
.list p { grid-column: 1 / -1; color: var(--ink-soft); font-size: 14px; }
.list .meta { font: 12px 'Martian Mono', monospace; color: #59618a; }
.list .links { grid-column: 1 / -1; display: flex; gap: 12px; font: 500 13px 'Martian Mono', monospace; }
.list .links a { text-decoration: none; border-bottom: 1px solid currentColor; }
.list .links a:hover { color: #2c47b8; }

.term { font: 13px/1.6 'Martian Mono', monospace; min-height: 220px; }
.term .y { color: var(--yellow); } .term .g { color: var(--green); } .term .w { color: var(--ink-on-navy); }
.term form { display: flex; gap: 8px; }
.term input { all: unset; flex: 1; color: var(--ink-on-navy); caret-color: var(--yellow); }

.dock { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 6px; padding: 8px; border-radius: 14px; background: #0c1835e6; border: 1px solid var(--line-strong); z-index: 999; }
.dock button { all: unset; cursor: pointer; display: grid; justify-items: center; gap: 4px; padding: 6px 8px; border-radius: 8px; font: 11px 'Martian Mono', monospace; color: var(--muted-on-navy); transition: transform .2s var(--ease), color .15s; }
.dock button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.dock button:hover, .dock button:focus-visible { transform: translateY(-5px); color: var(--yellow); }
.dock button.open::after { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--yellow); }

@media (max-width: 760px) {
  body { overflow: auto; }
  .desk { position: static; padding: 50px 16px 110px; display: flex; flex-direction: column; gap: 16px; }
  .win { position: static !important; width: auto !important; max-height: none; }
  .pipeline, .annot, .menubar .hide-sm { display: none; }
  .dock { gap: 0; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<script>
const desk = document.getElementById('desk'), surface = document.getElementById('pan'), canvas = document.getElementById('canvas'), layer = document.getElementById('windows');
const wins = {
  readme:     { title: 'readme.md',      x: 40,  y: 56,  w: 520 },
  terminal:   { title: 'zsh — jvb',      x: 600, y: 56,  w: 400, dark: true },
  projects:   { title: 'projects/',      x: 120, y: 80,  w: 560 },
  research:   { title: 'qlink.pdf',      x: 640, y: 120, w: 420 },
  experience: { title: 'experience.log', x: 200, y: 100, w: 540 },
  music:      { title: 'on-repeat.m3u',  x: 680, y: 260, w: 360 },
};
let z = 10;

function open(id) {
  const existing = document.getElementById('win-' + id);
  if (existing) { existing.style.zIndex = ++z; return; }
  const c = wins[id];
  const el = document.createElement('section');
  el.className = 'win' + (c.dark ? ' dark' : '');
  el.id = 'win-' + id;
  el.setAttribute('aria-label', c.title);
  const maxX = Math.max(16, innerWidth - c.w - 16);
  Object.assign(el.style, { left: Math.min(c.x, maxX) + 'px', top: c.y + 'px', width: c.w + 'px', zIndex: ++z });
  el.innerHTML = `<div class="bar"><button class="x" aria-label="Close ${c.title}"></button><button aria-hidden="true" tabindex="-1"></button><button aria-hidden="true" tabindex="-1"></button><span>${c.title}</span></div><div class="body"></div>`;
  el.querySelector('.body').append(document.getElementById('tpl-' + id).content.cloneNode(true));
  el.querySelector('.x').onclick = () => { el.classList.add('closing'); el.addEventListener('animationend', () => { el.remove(); markDock(); }, { once: true }); };
  el.addEventListener('pointerdown', () => el.style.zIndex = ++z);
  drag(el, el.querySelector('.bar'));
  layer.append(el);
  if (id === 'readme') countUp(el);
  if (id === 'terminal') term(el);
  markDock();
}

function drag(el, handle) {
  handle.addEventListener('pointerdown', e => {
    if (e.target.tagName === 'BUTTON' || innerWidth <= 760) return;
    const sx = e.clientX - el.offsetLeft, sy = e.clientY - el.offsetTop;
    handle.setPointerCapture(e.pointerId);
    const move = ev => { el.style.left = ev.clientX - sx + 'px'; el.style.top = Math.max(0, ev.clientY - sy) + 'px'; };
    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', () => handle.removeEventListener('pointermove', move), { once: true });
  });
}

const state = { panX: 0, panY: 0 };
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
let frame = 0, anim = 0;

function paint() {
  frame = 0;
  canvas.style.transform = `translate(${state.panX}px, ${state.panY}px)`;
  surface.style.setProperty('--gx', state.panX % 24 + 'px');
  surface.style.setProperty('--gy', state.panY % 24 + 'px');
}

function pan(dx, dy) {
  state.panX += dx; state.panY += dy;
  if (!frame) frame = requestAnimationFrame(paint);
}

function glide(x, y) {
  cancelAnimationFrame(anim);
  if (reduced.matches) { pan(x - state.panX, y - state.panY); return; }
  const x0 = state.panX, y0 = state.panY, t0 = performance.now();
  const step = t => {
    const p = Math.min(1, (t - t0) / 400), e = 1 - Math.pow(1 - p, 3);
    pan(x0 + (x - x0) * e - state.panX, y0 + (y - y0) * e - state.panY);
    if (p < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}

const recenter = () => glide(0, 0);

let drag0 = null, moved = false, swallow = 0;
surface.addEventListener('pointerdown', e => {
  if (!e.isPrimary || e.button !== 0) return;
  cancelAnimationFrame(anim);
  drag0 = { id: e.pointerId, x: e.clientX, y: e.clientY };
  moved = false;
});
surface.addEventListener('pointermove', e => {
  if (!drag0 || e.pointerId !== drag0.id) return;
  const dx = e.clientX - drag0.x, dy = e.clientY - drag0.y;
  if (!moved) {
    if (Math.hypot(dx, dy) <= 4) return;
    moved = true;
    surface.setPointerCapture(e.pointerId);
    surface.classList.add('grabbing');
  }
  drag0.x = e.clientX; drag0.y = e.clientY;
  pan(dx, dy);
});
const endDrag = e => {
  if (!drag0 || e.pointerId !== drag0.id) return;
  drag0 = null;
  surface.classList.remove('grabbing');
  if (moved) { swallow = 1; setTimeout(() => swallow = 0, 50); }
};
surface.addEventListener('pointerup', endDrag);
surface.addEventListener('pointercancel', endDrag);
document.addEventListener('click', e => { if (swallow) { e.preventDefault(); e.stopPropagation(); swallow = 0; } }, true);

desk.addEventListener('wheel', e => {
  if (e.ctrlKey || e.target.closest('.win .body') || (innerWidth <= 760 && !e.target.closest('#pan'))) return;
  e.preventDefault();
  const k = e.deltaMode === 1 ? 16 : 1;
  pan(-e.deltaX * k, -e.deltaY * k);
}, { passive: false });

const arrows = { ArrowLeft: [40, 0], ArrowRight: [-40, 0], ArrowUp: [0, 40], ArrowDown: [0, -40] };
document.addEventListener('keydown', e => {
  if (innerWidth <= 760 || document.activeElement !== document.body || !arrows[e.key]) return;
  e.preventDefault();
  pan(...arrows[e.key]);
});

document.getElementById('recenter').onclick = recenter;

function markDock() {
  document.querySelectorAll('.dock button').forEach(b => b.classList.toggle('open', !!document.getElementById('win-' + b.dataset.open)));
}

function countUp(root) {
  root.querySelectorAll('[data-count]').forEach(n => {
    const end = +n.dataset.count, t0 = performance.now(), dur = 1200;
    const tick = t => {
      const p = Math.min(1, (t - t0) / dur), v = Math.round(end * (1 - Math.pow(1 - p, 3)));
      n.textContent = v.toLocaleString('en-US') + (p === 1 ? n.dataset.suffix : '');
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

function term(root) {
  const out = root.querySelector('#out'), input = root.querySelector('#in');
  const cmds = {
    help: () => 'commands: <span class="y">whoami</span>, <span class="y">projects</span>, <span class="y">open</span> &lt;window&gt;, <span class="y">resume</span>, <span class="y">contact</span>, <span class="y">clear</span>',
    whoami: () => '<span class="g">software &amp; AI engineer · Penn State CS \'26 · Ashburn, VA</span>',
    projects: () => '<span class="y">clareia  new-home  agents  zorai  cognitra  meridian</span>',
    resume: () => { open('readme'); return 'opening readme.md — resume button inside'; },
    contact: () => 'jvitorbarros15@gmail.com · linkedin.com/in/joaovi',
    clear: () => { out.innerHTML = ''; return null; },
    open: a => wins[a] ? (open(a), 'opening ' + wins[a].title) : 'open: try ' + Object.keys(wins).join(', '),
  };
  root.querySelector('#cmd').onsubmit = e => {
    e.preventDefault();
    const [c, ...args] = input.value.trim().split(/\s+/);
    input.value = '';
    if (!c) return;
    const res = cmds[c] ? cmds[c](args[0]) : `command not found: ${c.replace(/</g, '&lt;')}`;
    if (res !== null) out.insertAdjacentHTML('beforeend', `<span class="y">$</span> ${c.replace(/</g, '&lt;')} ${args.join(' ').replace(/</g, '&lt;')}<br>${res}<br>`);
    out.parentElement.parentElement.scrollTop = 1e6;
  };
  root.addEventListener('click', () => input.focus());
}

document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => open(b.dataset.open));
const clock = document.getElementById('clock');
const tickClock = () => clock.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
tickClock(); setInterval(tickClock, 30000);

open('readme');
setTimeout(() => innerWidth > 760 && open('terminal'), 250);
</script>
</body>
