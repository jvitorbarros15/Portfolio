<template id="tpl-projects">
  <h2>Projects</h2>
  <ul class="list">
    <li><h3>Clareia</h3><span class="meta">2026 · 500+ users</span><p>Brazil Congress transparency site: 592 deputies, 226K expense records, 473K votes. Dual-capture ingestion with an independent re-audit; payload cut from 200 MB to 1 MB.</p><span class="links"><a href="https://clareia.clareia.workers.dev/" target="_blank" rel="noopener">live</a><a href="https://github.com/jvitorbarros15/clareia" target="_blank" rel="noopener">source</a></span></li>
    <li><h3>New Home Imóveis</h3><span class="meta">2026 · paying client</span><p>Real-estate platform with WhatsApp lead capture synced into HubSpot and an admin back office.</p><span class="links"><a href="./case-studies/new-home.html">case study</a><a href="https://new-home-imoveis.vercel.app" target="_blank" rel="noopener">live</a></span></li>

<script>
const desk = document.getElementById('desk'), surface = document.getElementById('pan'), canvas = document.getElementById('canvas'), layer = document.getElementById('windows');
const wins = {
  readme:     { title: 'readme.md',      x: 40,  y: 56,  w: 520 },
  terminal:   { title: 'zsh — jvb',      x: 600, y: 56,  w: 400, dark: true },
  projects:   { title: 'projects/',      x: 120, y: 80,  w: 560 },
  research:   { title: 'qlink.pdf',      x: 640, y: 120, w: 420 },
  experience: { title: 'experience.log', x: 200, y: 100, w: 540 },
  music:      { title: 'on-repeat.m3u',  x: 680, y: 260, w: 360 },
  certs:      { title: 'certificates/',  x: 260, y: 90,  w: 520 },

let z = 10;

function remove(el) { el.remove(); markDock(); }

function closeWin(el) {
  if (reduced.matches || getComputedStyle(el).animationName === 'none') return remove(el);
  el.classList.add('closing');
  el.addEventListener('animationend', () => remove(el), { once: true });
  setTimeout(() => el.isConnected && remove(el), 400);
}

function reveal(el) {
  el.style.zIndex = ++z;
  if (mobile()) el.scrollIntoView({ behavior: reduced.matches ? 'auto' : 'smooth', block: 'start' });
}

function open(id) {
  let existing = document.getElementById('win-' + id);
  if (existing && existing.classList.contains('closing')) { remove(existing); existing = null; }
  if (existing) { reveal(existing); return; }
  const c = wins[id];
  const el = document.createElement('section');
  el.className = 'win' + (c.dark ? ' dark' : '');
  el.id = 'win-' + id;
  el.setAttribute('aria-label', c.title);
  const maxX = Math.max(16, innerWidth - c.w - 16);
  Object.assign(el.style, { left: Math.min(c.x, maxX) + 'px', top: c.y + 'px', width: c.w + 'px', zIndex: ++z });
  el.innerHTML = `<div class="bar"><button class="x" aria-label="Close ${c.title}"></button><button aria-hidden="true" tabindex="-1"></button><button aria-hidden="true" tabindex="-1"></button><span>${c.title}</span></div><div class="body"></div>`;

  el.querySelector('.x').onclick = () => closeWin(el);

}

function drag(el, handle) {
  handle.addEventListener('pointerdown', e => {
    if (e.target.tagName === 'BUTTON' || innerWidth <= 760) return;
    const sx = e.clientX - el.offsetLeft, sy = e.clientY - el.offsetTop;
    handle.setPointerCapture(e.pointerId);
    const move = ev => {
      el.style.left = Math.min(layer.clientWidth - 80, Math.max(80 - el.offsetWidth, ev.clientX - sx)) + 'px';
      el.style.top = Math.min(layer.clientHeight - 36, Math.max(0, ev.clientY - sy)) + 'px';
    };
    const end = () => { handle.removeEventListener('pointermove', move); handle.removeEventListener('pointerup', end); handle.removeEventListener('pointercancel', end); };
    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', end);
    handle.addEventListener('pointercancel', end);
  });
}

const state = { panX: 0, panY: 0 };
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
let frame = 0, anim = 0;

function paint() {
  frame = 0;
  canvas.style.transform = `translate(${state.panX}px, ${state.panY}px)`;
  surface.style.setProperty('--gx', state.panX % 24 + 'px');
  surface.style.setProperty('--gy', state.panY % 24 + 'px');
}

function pan(dx, dy) {
  state.panX += dx; state.panY += dy;
  if (!frame) frame = requestAnimationFrame(paint);
}

function glide(x, y) {
  cancelAnimationFrame(anim);
  if (reduced.matches) { pan(x - state.panX, y - state.panY); return; }
  const x0 = state.panX, y0 = state.panY, t0 = performance.now();
  const step = t => {
    const p = Math.min(1, (t - t0) / 400), e = 1 - Math.pow(1 - p, 3);
    pan(x0 + (x - x0) * e - state.panX, y0 + (y - y0) * e - state.panY);
    if (p < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}


let drag0 = null, moved = false, swallow = 0;
surface.addEventListener('pointerdown', e => {
  if (!e.isPrimary || e.button !== 0) return;
  cancelAnimationFrame(anim);
  drag0 = { id: e.pointerId, x: e.clientX, y: e.clientY };
  moved = false;
});
surface.addEventListener('pointermove', e => {
  if (!drag0 || e.pointerId !== drag0.id) return;
  const dx = e.clientX - drag0.x, dy = e.clientY - drag0.y;
  if (!moved) {
    if (Math.hypot(dx, dy) <= 4) return;
    moved = true;
    surface.setPointerCapture(e.pointerId);
    surface.classList.add('grabbing');
  }
  drag0.x = e.clientX; drag0.y = e.clientY;
  pan(dx, dy);
});
const endDrag = e => {
  if (!drag0 || e.pointerId !== drag0.id) return;
  drag0 = null;
  surface.classList.remove('grabbing');
  if (moved) { swallow = 1; setTimeout(() => swallow = 0, 50); }
};
surface.addEventListener('pointerup', endDrag);
surface.addEventListener('pointercancel', endDrag);
document.addEventListener('click', e => { if (swallow) { e.preventDefault(); e.stopPropagation(); swallow = 0; } }, true);

desk.addEventListener('wheel', e => {
  if (e.ctrlKey || e.target.closest('.win .body') || (innerWidth <= 760 && !e.target.closest('#pan'))) return;
  e.preventDefault();
  const k = e.deltaMode === 1 ? 16 : 1;
  pan(-e.deltaX * k, -e.deltaY * k);
}, { passive: false });

const arrows = { ArrowLeft: [40, 0], ArrowRight: [-40, 0], ArrowUp: [0, 40], ArrowDown: [0, -40] };
document.addEventListener('keydown', e => {
  if (innerWidth <= 760 || !arrows[e.key] || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  const t = e.target;
  if (t.closest('input, textarea, select, [contenteditable]')) return;
  const body = t.closest('.win .body');
  if (body && (body.scrollHeight > body.clientHeight || body.scrollWidth > body.clientWidth)) return;
  e.preventDefault();
  pan(...arrows[e.key]);
});


const NS = 'http://www.w3.org/2000/svg';
const svgEl = (name, attrs = {}, text) => {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
};

const rect = n => ({ x: n.x, y: n.y, w: n.w || 22, h: n.h || (n.kind === 'actor' ? 22 : n.kind === 'db' ? 60 : n.sub ? 48 : 40) });

function anchors(a, b) {
  const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x), oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
  if (oy > 0) { const y = Math.max(a.y, b.y) + oy / 2; return a.x < b.x ? [[a.x + a.w, y], [b.x, y]] : [[a.x, y], [b.x + b.w, y]]; }
  const x = Math.max(a.x, b.x) + ox / 2;
  return a.y < b.y ? [[x, a.y + a.h], [x, b.y]] : [[x, a.y], [x, b.y + b.h]];
}

const isZone = n => n.zone || n.group;

function renderZone(n, g) {
  const { x, y, w, h } = rect(n);
  const end = n.la === 'end';
  g.append(svgEl('rect', { class: 'zone ' + (n.tone || ''), x, y, width: w, height: h, rx: 8 }), svgEl('text', { class: 'zlabel ' + (n.tone || ''), x: end ? x + w - 12 : x + 12, y: n.at === 'bottom' ? y + h - 10 : y + 18, 'text-anchor': end ? 'end' : 'start' }, n.label));
}

function renderNode(n, g) {
  const { x, y, w, h } = rect(n), cls = 'shape ' + (n.kind === 'ext' || n.ext ? 'ext ' : '') + (n.hl ? 'hl' : '');
  if (n.kind === 'label') { g.append(svgEl('text', { class: 'tag big', x: x + w / 2, y: y + 14, 'text-anchor': 'middle' }, n.label)); return; }
  if (n.kind === 'actor') {
    g.append(svgEl('circle', { class: cls, cx: x + 11, cy: y + 11, r: 11 }), svgEl('text', { x: x + 11, y: y + 36, 'text-anchor': 'middle' }, n.label));
    return;
  }
  if (n.kind === 'db') {
    const ry = 9, rx = w / 2;
    g.append(svgEl('path', { class: cls, d: `M${x} ${y + ry}a${rx} ${ry} 0 0 1 ${w} 0a${rx} ${ry} 0 0 1 ${-w} 0v${h - 2 * ry}a${rx} ${ry} 0 0 0 ${w} 0v${-(h - 2 * ry)}` }));
  } else {
    g.append(svgEl('rect', { class: cls, x, y, width: w, height: h, rx: n.pill ? h / 2 : 4 }));
  }
  const top = n.kind === 'db' ? 9 : 0;
  if (n.lines) {
    g.append(svgEl('text', { x: x + w / 2, y: y + top + 22, 'text-anchor': 'middle' }, n.label));
    n.lines.forEach((l, i) => g.append(svgEl('text', { class: 'sub', x: x + w / 2, y: y + top + 46 + i * (n.gap || 18), 'text-anchor': 'middle' }, l)));
    return;
  }
  const cy = y + h / 2 + (n.kind === 'db' ? 5 : 0);
  g.append(svgEl('text', { x: x + w / 2, y: n.sub ? cy - 3 : cy + 4, 'text-anchor': 'middle' }, n.label));
  if (n.sub) g.append(svgEl('text', { class: 'sub', x: x + w / 2, y: cy + 12, 'text-anchor': 'middle' }, n.sub));
}

function longest(pts) {
  let best = [pts[0], pts[1]], len = -1;
  for (let i = 1; i < pts.length; i++) {
    const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    if (l > len) { len = l; best = [pts[i - 1], pts[i]]; }
  }
  return [(best[0][0] + best[1][0]) / 2, (best[0][1] + best[1][1]) / 2];
}

function renderDiagram(d) {
  const num = diagrams.indexOf(d) + 2, mid = 'arrow-' + d.id;
  const svg = svgEl('svg', { class: 'diagram', viewBox: `0 0 ${d.w} ${d.h}`, width: d.w, height: d.h, style: `left:${d.x}px;top:${d.y}px` });
  const defs = svgEl('defs');
  [['', 'arrow'], ['y', 'arrow y']].forEach(([k, cls]) => {
    const m = svgEl('marker', { id: mid + k, viewBox: '0 0 8 8', refX: 8, refY: 4, markerWidth: 8, markerHeight: 8, orient: 'auto-start-reverse', markerUnits: 'userSpaceOnUse' });
    m.append(svgEl('path', { class: cls, d: 'M0 0L8 4L0 8z' }));
    defs.append(m);
  });
  const link = svgEl('a', { role: 'button', tabindex: 0, 'aria-label': 'Open ' + d.title });
  link.append(
    svgEl('rect', { class: 'boundary', x: 1, y: 1, width: d.w - 2, height: d.h - 2, rx: 10 }),
    svgEl('text', { class: 'tag', x: 24, y: 30 }, `fig. ${num} — ${d.title}`),
    svgEl('text', { class: 'tag', x: d.w - 24, y: 30, 'text-anchor': 'end' }, `opens ${d.opens} →`)
  );
  const byId = Object.fromEntries(d.nodes.map(n => [n.id, n]));
  d.nodes.filter(isZone).forEach(n => renderZone(n, link));
  const chips = [];
  d.edges.forEach(e => {
    const pts = e.pts || anchors(rect(byId[e.from]), rect(byId[e.to])), k = e.tone === 'y' ? 'y' : '';
    const attrs = { class: 'edge' + (e.dashed ? ' dashed' : '') + (k ? ' y' : ''), d: 'M' + pts.map(p => p.join(' ')).join('L'), 'marker-end': `url(#${mid + k})` };
    if (e.both) attrs['marker-start'] = `url(#${mid + k})`;
    link.append(svgEl('path', attrs));
    if (e.label) chips.push([e.label, e.lp || longest(pts)]);
  });
  d.nodes.filter(n => !isZone(n)).forEach(n => renderNode(n, link));
  chips.forEach(([label, [mx, my]]) => {
    const cw = label.length * 7.8 + 14;
    link.append(svgEl('rect', { class: 'chip', x: mx - cw / 2, y: my - 10, width: cw, height: 20 }), svgEl('text', { class: 'tag', x: mx, y: my + 4, 'text-anchor': 'middle' }, label));
  });
  if (d.note) link.append(svgEl('text', { class: 'note', x: 24, y: d.h - 22 }, d.note));
  link.addEventListener('click', () => open(d.opens));
  link.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(d.opens); } });
  svg.append(defs, link);
  return svg;
}

diagrams.forEach(d => canvas.append(renderDiagram(d)));

const mobile = () => innerWidth <= 760;
const recenter = () => mobile() ? panTo(diagrams[0]) : glide(0, 0);
document.getElementById('recenter').onclick = recenter;
const exploreBtn = document.getElementById('explore');
exploreBtn.onclick = () => {
  const on = surface.classList.toggle('explore');
  exploreBtn.setAttribute('aria-pressed', on);
  exploreBtn.textContent = on ? 'Done' : 'Explore';
};

function panTo(d) {
  if (mobile()) { glide(16 - d.x, 16 - d.y); return; }
  const w = surface.clientWidth, h = surface.clientHeight;
  glide(d.w > w - 32 ? 16 - d.x : w / 2 - (d.x + d.w / 2), d.h > h - 140 ? 16 - d.y : h - 110 - d.h - d.y);
}

const mapEl = document.getElementById('map'), mapBtn = document.getElementById('map-btn');
const toggleMap = show => {
  mapEl.hidden = !show;
  mapBtn.setAttribute('aria-expanded', show);
};
diagrams.forEach((d, i) => {
  const b = document.createElement('button');
  b.innerHTML = `<span>fig. ${i + 2}</span>${d.title}`;
  b.onclick = () => { panTo(d); toggleMap(false); };
  mapEl.append(b);
});
mapBtn.onclick = () => toggleMap(mapEl.hidden);
document.addEventListener('pointerdown', e => { if (!mapEl.hidden && !e.target.closest('#map, #map-btn')) toggleMap(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !mapEl.hidden) { toggleMap(false); mapBtn.focus(); } });

function markDock() {
  document.querySelectorAll('.dock button').forEach(b => {
    const on = !!document.getElementById('win-' + b.dataset.open);
    b.classList.toggle('open', on);
    b.setAttribute('aria-pressed', on);
  });
}

function countUp(root) {
  root.querySelectorAll('[data-count]').forEach(n => {
    const end = +n.dataset.count;
    if (reduced.matches) { n.textContent = end.toLocaleString('en-US') + n.dataset.suffix; return; }
    const t0 = performance.now(), dur = 1200;
    const tick = t => {
      const p = Math.min(1, (t - t0) / dur), v = Math.round(end * (1 - Math.pow(1 - p, 3)));
      n.textContent = v.toLocaleString('en-US') + (p === 1 ? n.dataset.suffix : '');
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

function term(root) {
  const out = root.querySelector('#out'), input = root.querySelector('#in');
  const cmds = {
    help: () => 'commands: <span class="y">whoami</span>, <span class="y">projects</span>, <span class="y">open</span> &lt;window&gt;, <span class="y">resume</span>, <span class="y">contact</span>, <span class="y">clear</span>',
    whoami: () => '<span class="g">software &amp; AI engineer · Penn State CS \'26 · Ashburn, VA</span>',
    projects: () => '<span class="y">clareia  new-home  agents  zorai  cognitra  meridian  jobnow  nfl-4th-down</span>',
    resume: () => { open('readme'); return 'opening readme.md — resume button inside'; },
    contact: () => 'jvitorbarros15@gmail.com · linkedin.com/in/joaovi',
    clear: () => { out.innerHTML = ''; return null; },
    open: a => Object.hasOwn(wins, a) ? (open(a), 'opening ' + wins[a].title) : 'open: try ' + Object.keys(wins).join(', '),
  };
  root.querySelector('#cmd').onsubmit = e => {
    e.preventDefault();
    const [c, ...args] = input.value.trim().split(/\s+/);
    input.value = '';
    if (!c) return;
    const res = Object.hasOwn(cmds, c) ? cmds[c](args[0]) : `command not found: ${c.replace(/</g, '&lt;')}`;
    if (res !== null) out.insertAdjacentHTML('beforeend', `<span class="y">$</span> ${c.replace(/</g, '&lt;')} ${args.join(' ').replace(/</g, '&lt;')}<br>${res}<br>`);
    out.parentElement.parentElement.scrollTop = 1e6;
  };
  root.addEventListener('click', () => input.focus());
}

document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => open(b.dataset.open));
const clock = document.getElementById('clock');
const tickClock = () => clock.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
tickClock(); setInterval(tickClock, 30000);

open('readme');
if (mobile()) recenter();
setTimeout(() => !mobile() && open('terminal'), 250);
