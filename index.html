<style>
:root {
  --navy: #0f1b3d; --navy-deep: #08112a; --line: #ffffff12; --line-strong: #ffffff26;
  --ink-on-navy: #dfe6ff; --muted-on-navy: #9fb0e8;

  --yellow: #ffd166; --green: #7ee0a5;

}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--navy);
  color: var(--ink-on-navy); font: 15px/1.55 'Archivo', system-ui, sans-serif; overflow: hidden;
}
a { color: inherit; }
.mono { font-family: 'Martian Mono', ui-monospace, monospace; }

.menubar .right { margin-left: auto; display: flex; gap: 16px; align-items: center; }
.menubar .recruiter { color: var(--yellow); border: 1px solid var(--yellow); border-radius: 4px; padding: 3px 9px; text-decoration: none; white-space: nowrap; }
.menubar .recruiter:hover, .menubar .recruiter:focus-visible { background: var(--yellow); color: var(--navy-deep); }
.menubar .recenter { border: 1px solid var(--line-strong); border-radius: 4px; padding: 3px 8px; }
.bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; vertical-align: middle; margin-right: 6px; }

.bars i:nth-child(2) { animation-delay: .15s } .bars i:nth-child(3) { animation-delay: .3s } .bars i:nth-child(4) { animation-delay: .45s }

.diagram .big { font-size: 22px; }
.diagram .edge.y { stroke: var(--yellow); }
.diagram .arrow.y { fill: var(--yellow); }

<script>
const desk = document.getElementById('desk'), surface = document.getElementById('pan'), canvas = document.getElementById('canvas'), layer = document.getElementById('windows');
const wins = {
  readme:     { title: 'readme.md',      x: 40,  y: 56,  w: 520 },
  terminal:   { title: 'zsh — jvb',      x: 600, y: 56,  w: 400, dark: true },
  projects:   { title: 'projects/',      x: 120, y: 80,  w: 560 },
  research:   { title: 'qlink.pdf',      x: 640, y: 120, w: 420 },
  experience: { title: 'experience.log', x: 200, y: 100, w: 540 },
  music:      { title: 'on-repeat.m3u',  x: 680, y: 260, w: 360 },
  certs:      { title: 'certificates/',  x: 260, y: 90,  w: 520 },
};
let z = 10;

function remove(el) { el.remove(); markDock(); }

function closeWin(el) {
  if (reduced.matches || getComputedStyle(el).animationName === 'none') return remove(el);
  el.classList.add('closing');
  el.addEventListener('animationend', () => remove(el), { once: true });
  setTimeout(() => el.isConnected && remove(el), 400);
}

function reveal(el) {
  el.style.zIndex = ++z;
}

function open(id) {
  let existing = document.getElementById('win-' + id);
  if (existing && existing.classList.contains('closing')) { remove(existing); existing = null; }
  if (existing) { reveal(existing); return; }
  const c = wins[id];
  const el = document.createElement('section');
  el.className = 'win' + (c.dark ? ' dark' : '');
  el.id = 'win-' + id;
  el.setAttribute('aria-label', c.title);
  const maxX = Math.max(16, innerWidth - c.w - 16);
  Object.assign(el.style, { left: Math.min(c.x, maxX) + 'px', top: c.y + 'px', width: c.w + 'px', zIndex: ++z });
  el.innerHTML = `<div class="bar"><button class="x" aria-label="Close ${c.title}"></button><button aria-hidden="true" tabindex="-1"></button><button aria-hidden="true" tabindex="-1"></button><span>${c.title}</span></div><div class="body"></div>`;
  el.querySelector('.body').append(document.getElementById('tpl-' + id).content.cloneNode(true));
  el.querySelector('.x').onclick = () => closeWin(el);
  if (id === 'projects' || id === 'experience' || id === 'research') wireArch(el.querySelector('.body'));
  el.addEventListener('pointerdown', () => el.style.zIndex = ++z);
  drag(el, el.querySelector('.bar'));
  layer.append(el);
  if (id === 'readme') countUp(el);
  if (id === 'terminal') term(el);
  markDock();
}

function drag(el, handle) {
  handle.addEventListener('pointerdown', e => {
    if (e.target.tagName === 'BUTTON' || innerWidth <= 760) return;
    const sx = e.clientX - el.offsetLeft, sy = e.clientY - el.offsetTop;
    handle.setPointerCapture(e.pointerId);
    const move = ev => {
      el.style.left = Math.min(layer.clientWidth - 80, Math.max(80 - el.offsetWidth, ev.clientX - sx)) + 'px';
      el.style.top = Math.min(layer.clientHeight - 36, Math.max(0, ev.clientY - sy)) + 'px';
    };
    const end = () => { handle.removeEventListener('pointermove', move); handle.removeEventListener('pointerup', end); handle.removeEventListener('pointercancel', end); };
    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', end);
    handle.addEventListener('pointercancel', end);
  });
}

const state = { panX: 0, panY: 0 };
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
let frame = 0, anim = 0;

function paint() {
  frame = 0;
  canvas.style.transform = `translate(${state.panX}px, ${state.panY}px)`;
  surface.style.setProperty('--gx', state.panX % 24 + 'px');
  surface.style.setProperty('--gy', state.panY % 24 + 'px');
}

function pan(dx, dy) {
  state.panX += dx; state.panY += dy;
  if (!frame) frame = requestAnimationFrame(paint);
}

function glide(x, y) {
  cancelAnimationFrame(anim);
  if (reduced.matches) { pan(x - state.panX, y - state.panY); return; }
  const x0 = state.panX, y0 = state.panY, t0 = performance.now();
  const step = t => {
    const p = Math.min(1, (t - t0) / 400), e = 1 - Math.pow(1 - p, 3);
    pan(x0 + (x - x0) * e - state.panX, y0 + (y - y0) * e - state.panY);
    if (p < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}


let drag0 = null, moved = false, swallow = 0;
surface.addEventListener('pointerdown', e => {
  if (!e.isPrimary || e.button !== 0) return;
  cancelAnimationFrame(anim);
  drag0 = { id: e.pointerId, x: e.clientX, y: e.clientY };
  moved = false;
});
surface.addEventListener('pointermove', e => {
  if (!drag0 || e.pointerId !== drag0.id) return;
  const dx = e.clientX - drag0.x, dy = e.clientY - drag0.y;
  if (!moved) {
    if (Math.hypot(dx, dy) <= 4) return;
    moved = true;
    surface.setPointerCapture(e.pointerId);
    surface.classList.add('grabbing');
  }

const NS = 'http://www.w3.org/2000/svg';
const svgEl = (name, attrs = {}, text) => {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
};

const rect = n => ({ x: n.x, y: n.y, w: n.w || 22, h: n.h || (n.kind === 'actor' ? 22 : n.kind === 'db' ? 60 : n.sub ? 48 : 40) });

function anchors(a, b) {
  const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x), oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
  if (oy > 0) { const y = Math.max(a.y, b.y) + oy / 2; return a.x < b.x ? [[a.x + a.w, y], [b.x, y]] : [[a.x, y], [b.x + b.w, y]]; }
  const x = Math.max(a.x, b.x) + ox / 2;
  return a.y < b.y ? [[x, a.y + a.h], [x, b.y]] : [[x, a.y], [x, b.y + b.h]];
}

const isZone = n => n.zone || n.group;

function renderZone(n, g) {
  const { x, y, w, h } = rect(n);
  const end = n.la === 'end';
  g.append(svgEl('rect', { class: 'zone ' + (n.tone || ''), x, y, width: w, height: h, rx: 8 }), svgEl('text', { class: 'zlabel ' + (n.tone || ''), x: end ? x + w - 12 : x + 12, y: n.at === 'bottom' ? y + h - 10 : y + 18, 'text-anchor': end ? 'end' : 'start' }, n.label));
}

function renderNode(n, g) {
  const { x, y, w, h } = rect(n), cls = 'shape ' + (n.kind === 'ext' || n.ext ? 'ext ' : '') + (n.hl ? 'hl' : '');
  if (n.kind === 'label') { g.append(svgEl('text', { class: 'tag big', x: x + w / 2, y: y + 14, 'text-anchor': 'middle' }, n.label)); return; }
  if (n.kind === 'actor') {
    g.append(svgEl('circle', { class: cls, cx: x + 11, cy: y + 11, r: 11 }), svgEl('text', { x: x + 11, y: y + 36, 'text-anchor': 'middle' }, n.label));
    return;
  }
  if (n.kind === 'db') {
    const ry = 9, rx = w / 2;
    g.append(svgEl('path', { class: cls, d: `M${x} ${y + ry}a${rx} ${ry} 0 0 1 ${w} 0a${rx} ${ry} 0 0 1 ${-w} 0v${h - 2 * ry}a${rx} ${ry} 0 0 0 ${w} 0v${-(h - 2 * ry)}` }));
  } else {
    g.append(svgEl('rect', { class: cls, x, y, width: w, height: h, rx: n.pill ? h / 2 : 4 }));
  }
  const top = n.kind === 'db' ? 9 : 0;
  if (n.lines) {
    g.append(svgEl('text', { x: x + w / 2, y: y + top + 22, 'text-anchor': 'middle' }, n.label));
    n.lines.forEach((l, i) => g.append(svgEl('text', { class: 'sub', x: x + w / 2, y: y + top + 46 + i * (n.gap || 18), 'text-anchor': 'middle' }, l)));
    return;
  }
  const cy = y + h / 2 + (n.kind === 'db' ? 5 : 0);
  g.append(svgEl('text', { x: x + w / 2, y: n.sub ? cy - 3 : cy + 4, 'text-anchor': 'middle' }, n.label));
  if (n.sub) g.append(svgEl('text', { class: 'sub', x: x + w / 2, y: cy + 12, 'text-anchor': 'middle' }, n.sub));
}

function longest(pts) {
  let best = [pts[0], pts[1]], len = -1;
  for (let i = 1; i < pts.length; i++) {
    const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    if (l > len) { len = l; best = [pts[i - 1], pts[i]]; }
  }
  return [(best[0][0] + best[1][0]) / 2, (best[0][1] + best[1][1]) / 2, best[0][1] === best[1][1] ? 'h' : 'v'];
}

function renderDiagram(d, viewer) {
  const num = diagrams.indexOf(d) + 2, mid = 'arrow-' + d.id + (viewer ? '-v' : '');
  const svg = svgEl('svg', viewer ? { class: 'diagram', viewBox: `0 0 ${d.w} ${d.h}`, width: d.w, height: d.h, role: 'img', 'aria-label': d.title + (d.note ? '. ' + d.note : '') } : { class: 'diagram', viewBox: `0 0 ${d.w} ${d.h}`, width: d.w, height: d.h, style: `left:${d.x}px;top:${d.y}px` });
  const defs = svgEl('defs');
  [['', 'arrow'], ['y', 'arrow y']].forEach(([k, cls]) => {
    const m = svgEl('marker', { id: mid + k, viewBox: '0 0 8 8', refX: 8, refY: 4, markerWidth: 8, markerHeight: 8, orient: 'auto-start-reverse', markerUnits: 'userSpaceOnUse' });
    m.append(svgEl('path', { class: cls, d: 'M0 0L8 4L0 8z' }));
    defs.append(m);
  });
  const link = viewer ? svgEl('g') : svgEl('a', { role: 'button', tabindex: 0, 'aria-label': 'Open ' + d.title });
  link.append(
    svgEl('rect', { class: 'boundary', x: 1, y: 1, width: d.w - 2, height: d.h - 2, rx: 10 }),
    svgEl('text', { class: 'tag', x: 24, y: 30 }, `fig. ${num} — ${d.title}`),
  );
  if (!viewer) link.append(svgEl('text', { class: 'tag', x: d.w - 24, y: 30, 'text-anchor': 'end' }, `opens ${d.opens} →`));
  const byId = Object.fromEntries(d.nodes.map(n => [n.id, n]));
  d.nodes.filter(isZone).forEach(n => renderZone(n, link));
  const chips = [];
  d.edges.forEach(e => {
    const pts = e.pts || anchors(rect(byId[e.from]), rect(byId[e.to])), k = e.tone === 'y' ? 'y' : '';
    const attrs = { class: 'edge' + (e.dashed ? ' dashed' : '') + (k ? ' y' : ''), d: 'M' + pts.map(p => p.join(' ')).join('L'), 'marker-end': `url(#${mid + k})` };
    if (e.both) attrs['marker-start'] = `url(#${mid + k})`;
    link.append(svgEl('path', attrs));
    if (e.label) chips.push([e.label, e.lp ? e.lp[2] ? e.lp : [...e.lp, pts.some((p, i) => i && p[1] === pts[i - 1][1] && p[1] === e.lp[1]) ? 'h' : 'v'] : longest(pts)]);
  });
  d.nodes.filter(n => !isZone(n)).forEach(n => renderNode(n, link));
  chips.forEach(([label, [x, y, dir]]) => {
    const cw = label.length * 7.8 + 14, mx = dir === 'v' ? x + cw / 2 + 6 : x, my = dir === 'h' ? y - 13 : y;
    link.append(svgEl('rect', { class: 'chip', x: mx - cw / 2, y: my - 10, width: cw, height: 20 }), svgEl('text', { class: 'tag', x: mx, y: my + 4, 'text-anchor': 'middle' }, label));
  });
  if (d.note) link.append(svgEl('text', { class: 'note', x: 24, y: d.h - 22 }, d.note));
  if (!viewer) {
    link.addEventListener('click', () => open(d.opens));
    link.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(d.opens); } });
  }
  svg.append(defs, link);
  return svg;
}

function countUp(root) {
  root.querySelectorAll('[data-count]').forEach(n => {
    const end = +n.dataset.count;
    if (reduced.matches) { n.textContent = end.toLocaleString('en-US') + n.dataset.suffix; return; }
    const t0 = performance.now(), dur = 1200;
    const tick = t => {
      const p = Math.min(1, (t - t0) / dur), v = Math.round(end * (1 - Math.pow(1 - p, 3)));
      n.textContent = v.toLocaleString('en-US') + (p === 1 ? n.dataset.suffix : '');
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

function term(root) {
  const out = root.querySelector('#out'), input = root.querySelector('#in');
  const cmds = {
    help: () => 'commands: <span class="y">whoami</span>, <span class="y">projects</span>, <span class="y">open</span> &lt;window&gt;, <span class="y">resume</span>, <span class="y">contact</span>, <span class="y">clear</span>',
    whoami: () => '<span class="g">software &amp; AI engineer · Penn State CS \'26 · Ashburn, VA</span>',
    projects: () => '<span class="y">clareia  new-home  agents  zorai  cognitra  meridian  jobnow  nfl-4th-down</span>',
    resume: () => { nav('readme'); return 'opening readme.md — resume button inside'; },
    contact: () => 'jvitorbarros15@gmail.com · linkedin.com/in/joaovi',
    clear: () => { out.innerHTML = ''; return null; },
    open: a => Object.hasOwn(wins, a) ? (nav(a), 'opening ' + wins[a].title) : 'open: try ' + Object.keys(wins).join(', '),
  };
  root.querySelector('#cmd').onsubmit = e => {
    e.preventDefault();
    const [c, ...args] = input.value.trim().split(/\s+/);
    input.value = '';
    if (!c) return;
    const res = Object.hasOwn(cmds, c) ? cmds[c](args[0]) : `command not found: ${c.replace(/</g, '&lt;')}`;
    if (res !== null) out.insertAdjacentHTML('beforeend', `<span class="y">$</span> ${c.replace(/</g, '&lt;')} ${args.join(' ').replace(/</g, '&lt;')}<br>${res}<br>`);
    out.parentElement.parentElement.scrollTop = 1e6;
  };
  root.addEventListener('click', () => input.focus());
}

function wireArch(root) {
  root.querySelectorAll('.list li > h3, h2').forEach(h => {

    b.setAttribute('aria-label', title + ': show architecture diagram');
    b.innerHTML = '<span class="t"></span><span class="hint" aria-hidden="true">→ diagram</span>';
    b.firstChild.textContent = title;
    b.onclick = () => showArch(id, b);

}

let phoneReady = false;
function buildPhone() {
  phoneReady = true;
  const main = $('m-main');
  sections.forEach(([id]) => {
    const c = wins[id];
    const card = document.createElement('section');
    card.className = 'card' + (c.dark ? ' dark' : '');
    card.id = 'm-' + id;
    card.setAttribute('aria-label', c.title);
    card.innerHTML = `<div class="bar"><i class="dots" aria-hidden="true"><b></b><b></b><b></b></i><span>${c.title}</span>${id === 'readme' ? '' : `<button class="tog" aria-expanded="true" aria-controls="m-body-${id}" aria-label="Collapse ${c.title}">${chevron}</button>`}</div><div class="body" id="m-body-${id}"></div>`;
    const body = card.querySelector('.body');
    body.append($('tpl-' + id).content.cloneNode(true));
    const tog = card.querySelector('.tog');
    if (tog) tog.onclick = () => setCollapsed(card, !card.classList.contains('collapsed'));
    main.append(card);
    if (id === 'projects' || id === 'experience') body.querySelectorAll('.list li').forEach(li => {
      const aid = archOf[li.querySelector('h3').textContent];
      if (!aid) return;
      let links = li.querySelector('.links');
      if (!links) { links = document.createElement('span'); links.className = 'links'; li.append(links); }
      links.prepend(archButton(aid));
    });
    if (id === 'projects' || id === 'experience' || id === 'research') wireArch(body);
    if (id === 'research') {
      const row = body.querySelector('.btn').parentElement;
      row.classList.add('ctas', 'inline');
      row.append(archButton('qlink'));
    }
    if (id === 'terminal') term(body);
  });
  const cap = document.createElement('p');
  cap.className = 'm-cap';
  cap.textContent = 'fig. 1 — João Vitor Barros, software & AI engineer, rev. 2026.11';
  main.prepend(cap);
  countUp($('m-readme'));
  buildSheet();
}

function setCollapsed(card, on) {
  card.classList.toggle('collapsed', on);
  card.querySelector('.body').hidden = on;
  const t = card.querySelector('.tog');
  t.setAttribute('aria-expanded', !on);
  t.setAttribute('aria-label', (on ? 'Expand ' : 'Collapse ') + wins[card.id.slice(2)].title);
}

function goTo(id) {
  const card = $('m-' + id);
  if (card && card.classList.contains('collapsed')) setCollapsed(card, false);
  if (!card || id === 'readme') scrollTo({ top: 0, behavior: behavior() });
  else card.scrollIntoView({ behavior: behavior(), block: 'start' });
}

function buildSheet() {
  const body = $('m-sheet-body');
  const row = (cls, label, tag, attrs = {}) => {
    const e = document.createElement(attrs.href ? 'a' : 'button');
    e.className = 'm-row ' + cls;
    e.innerHTML = (tag ? `<span>${tag}</span>` : '') + label;
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  };
  const eyebrow = (t, id) => { const p = document.createElement('p'); p.className = 'm-eyebrow'; p.textContent = t; if (id) p.id = id; return p; };
  body.append(eyebrow('Sections'));
  sections.forEach(([id, label], i) => {
    const r = row('', label, String(i + 1).padStart(2, '0'));
    r.onclick = () => leave(() => goTo(id));
    body.append(r);
  });
  body.append(eyebrow('Profile'),
    row('yel', 'Recruiter view', '→', { href: './recruiter.html' }),
    row('', 'Resume (PDF)', '↓', { href: './files/Joao_Vitor_Barros_da_Silva_Resume.pdf', download: '' }));
  body.append(eyebrow('Diagrams', 'm-dg'));
  diagrams.forEach((d, i) => {
    const r = row('', d.title, 'fig. ' + (i + 2));
    r.onclick = () => openViewer(i);
    body.append(r);
  });
}

let ov = null, opener = null;
const menuBtn = $('m-menu'), sheet = $('m-sheet'), view = $('m-view');
const inertEls = () => [document.querySelector('.m-top'), $('m-main'), $('m-tabs')];

function showOv(kind) {
  sheet.hidden = kind !== 'sheet';
  view.hidden = kind !== 'viewer';
  document.documentElement.classList.add('m-lock');
  inertEls().forEach(e => e.inert = true);
  menuBtn.setAttribute('aria-expanded', kind === 'sheet');
  ov = kind;
}

function hideOv() {
  sheet.hidden = true; view.hidden = true;
  document.documentElement.classList.remove('m-lock');
  inertEls().forEach(e => e.inert = false);
  menuBtn.setAttribute('aria-expanded', 'false');
  ov = null;
  if (opener && opener.isConnected) opener.focus({ preventScroll: true });
  opener = null;
}

function leave(then) {
  const had = ov;
  hideOv();
  if (had) history.back();
  then();
}

function closeOv() { if (ov) history.back(); }

function openSheet(toDiagrams) {
  if (ov || !mobile()) return;
  if (!phoneReady) buildPhone();
  opener = document.activeElement;
  history.pushState({ ov: 'sheet' }, '');
  showOv('sheet');
  const b = $('m-sheet-body');
  if (toDiagrams) b.scrollTop = $('m-dg').offsetTop - 8; else b.scrollTop = 0;
  $('m-sheet-x').focus({ preventScroll: true });
}

addEventListener('popstate', () => { if (ov) hideOv(); });
menuBtn.onclick = () => openSheet();
$('m-sheet-x').onclick = closeOv;
$('v-x').onclick = closeOv;

const stage = $('v-stage'), cv = $('v-cv');
const V = { i: 0, k: 1, x: 0, y: 0, fit: 1 };
const ptrs = new Map();
let pinch = null, multi = false, lastTap = null, animTimer = 0;

function vApply(animate) {
  if (animate && !reduced.matches) {
    cv.classList.add('anim');
    clearTimeout(animTimer);
    animTimer = setTimeout(() => cv.classList.remove('anim'), 260);
  }
  cv.style.transform = `translate(${V.x}px, ${V.y}px) scale(${V.k})`;
}

function vClamp() {
  const d = diagrams[V.i], W = stage.clientWidth, H = stage.clientHeight;
  V.k = Math.min(V.fit * 4, Math.max(V.fit * .5, V.k));
  V.x = Math.min(W - 60, Math.max(60 - d.w * V.k, V.x));
  V.y = Math.min(H - 60, Math.max(60 - d.h * V.k, V.y));
}

function vFit(animate) {
  const d = diagrams[V.i], W = stage.clientWidth, H = stage.clientHeight;
  V.fit = Math.min(W / d.w, H / d.h) * .96;
  V.k = V.fit;
  V.x = (W - d.w * V.k) / 2;
  V.y = (H - d.h * V.k) / 2;
  vApply(animate);
}

const atFit = () => Math.abs(V.k - V.fit) < V.fit * .02;

function zoomAt(px, py, nk, animate) {
  const cx = (px - V.x) / V.k, cy = (py - V.y) / V.k;
  V.k = nk;
  vClamp();
  V.x = px - cx * V.k; V.y = py - cy * V.k;
  vClamp();
  vApply(animate);
}

function showDiagram(i) {
  const n = diagrams.length;
  V.i = (i + n) % n;
  const d = diagrams[V.i];
  cv.replaceChildren(renderDiagram(d, true));
  cv.style.width = d.w + 'px'; cv.style.height = d.h + 'px';
  $('v-fig').textContent = `fig. ${V.i + 2} · ${V.i + 1} of ${n}`;
  $('v-title').textContent = d.title;
  ptrs.clear(); pinch = null;
  vFit(false);
}

function openViewer(i, from) {
  if (!mobile()) return;
  if (!phoneReady) buildPhone();
  if (ov === 'sheet') history.replaceState({ ov: 'viewer' }, '');
  else if (ov !== 'viewer') { opener = from || document.activeElement; history.pushState({ ov: 'viewer' }, ''); }
  showOv('viewer');
  $('v-hint').classList.remove('gone');
  showDiagram(i);
  $('v-x').focus({ preventScroll: true });
}

$('v-prev').onclick = () => showDiagram(V.i - 1);
$('v-next').onclick = () => showDiagram(V.i + 1);
$('v-fit').onclick = () => vFit(true);

const rel = e => { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };

function startPinch() {
  const [a, b] = [...ptrs.values()], r = stage.getBoundingClientRect();
  const mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
  pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, k: V.k, cx: (mx - V.x) / V.k, cy: (my - V.y) / V.k };
}

stage.addEventListener('pointerdown', e => {
  if (!e.isPrimary && ptrs.size === 0) return;
  stage.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, t: performance.now() });
  if (ptrs.size >= 2) { multi = true; startPinch(); }
  $('v-hint').classList.add('gone');
});

stage.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  const px = p.x, py = p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 1) {
    V.x += p.x - px; V.y += p.y - py;
    vClamp(); vApply();
  } else if (pinch) {
    const [a, b] = [...ptrs.values()], r = stage.getBoundingClientRect();
    const mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
    V.k = pinch.k * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d;
    V.k = Math.min(V.fit * 4, Math.max(V.fit * .5, V.k));
    V.x = mx - pinch.cx * V.k; V.y = my - pinch.cy * V.k;
    vClamp(); vApply();
  }
});

const pointerEnd = e => {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 1) { const q = [...ptrs.values()][0]; q.x0 = q.x; q.y0 = q.y; }
  if (ptrs.size > 0) return;
  const wasMulti = multi;
  multi = false;
  if (e.type !== 'pointerup' || wasMulti) { lastTap = null; return; }
  const now = performance.now();
  if (Math.hypot(e.clientX - p.x0, e.clientY - p.y0) > 10 || now - p.t > 350) { lastTap = null; return; }
  if (lastTap && now - lastTap.t < 320 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40) {
    lastTap = null;
    const [rx, ry] = rel(e);
    if (atFit()) zoomAt(rx, ry, V.fit * 2, true); else vFit(true);
  } else lastTap = { t: now, x: e.clientX, y: e.clientY };
};
stage.addEventListener('pointerup', pointerEnd);
stage.addEventListener('pointercancel', pointerEnd);

stage.addEventListener('wheel', e => {
  e.preventDefault();
  const [rx, ry] = rel(e);
  zoomAt(rx, ry, V.k * Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .002)));
}, { passive: false });

addEventListener('keydown', e => {
  if (!ov) return;
  if (e.key === 'Escape') { e.preventDefault(); closeOv(); }
  else if (ov === 'viewer' && e.key === 'ArrowRight') showDiagram(V.i + 1);
  else if (ov === 'viewer' && e.key === 'ArrowLeft') showDiagram(V.i - 1);
});

addEventListener('resize', () => {
  if (ov !== 'viewer') return;
  const was = atFit();
  if (was) vFit(); else { V.fit = Math.min(stage.clientWidth / diagrams[V.i].w, stage.clientHeight / diagrams[V.i].h) * .96; vClamp(); vApply(); }
});

const tabFor = { readme: 'home', projects: 'projects', research: 'projects', experience: 'projects', music: 'music' };
let spy = 0;
function paintTabs() {
  spy = 0;
  if (!mobile() || !phoneReady) return;
  let cur = 'readme';
  sections.forEach(([id]) => { if ($('m-' + id).getBoundingClientRect().top <= innerHeight * .4) cur = id; });
  document.querySelectorAll('.m-tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tabFor[cur]));
}
addEventListener('scroll', () => { if (!spy) spy = requestAnimationFrame(paintTabs); }, { passive: true });

document.querySelectorAll('.m-tabs button').forEach(b => b.onclick = () => {
  const t = b.dataset.tab;
  if (t === 'home') goTo('readme');
  else if (t === 'projects' || t === 'music') goTo(t);
  else openSheet(t === 'diagrams');
});

let deskReady = false;
function enterDesktop() {
  if (deskReady) return;
  deskReady = true;
  open('readme');
  setTimeout(() => open('terminal'), 250);
}
function enterPhone() {
  if (!phoneReady) buildPhone();
  paintTabs();
}
mq.addEventListener('change', e => {
  if (e.matches) enterPhone();
  else {
    const had = ov;
    hideOv();
    if (had) history.back();
    enterDesktop();
  }
});

document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => open(b.dataset.open));
const clock = document.getElementById('clock');
const tickClock = () => clock.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
tickClock(); setInterval(tickClock, 30000);

if (mobile()) enterPhone(); else enterDesktop();
</script>
